<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>免费大模型API额度导航 2026 | Free LLM Quota Hub</title>
<meta name="description" content="2026年最新免费大模型API额度汇总：硅基流动、阿里云百炼、百度千帆、Gemini、Groq、OpenRouter等40+平台一站式查询。">
<style>
  :root{
    --bg:#0b0e14; --card:#131822; --card2:#1a2130; --border:#243044;
    --text:#e8edf6; --muted:#8b96a8; --accent:#4f8cff; --accent2:#22c58b;
    --gold:#f5b942; --danger:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI","PingFang SC",sans-serif;line-height:1.6;min-height:100vh}
  a{color:var(--accent);text-decoration:none}
  header{padding:36px 20px 12px;text-align:center;position:relative}
  header h1 .g{background:linear-gradient(90deg,#4f8cff,#22c58b,#f5b942);-webkit-background-clip:text;background-clip:text;color:transparent}
  .langsw{position:absolute;top:14px;right:16px;cursor:pointer;border:1px solid var(--border);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--muted);background:var(--card)}
  .stats{display:flex;justify-content:center;gap:28px;margin:20px auto 0;flex-wrap:wrap}
  .stat b{font-size:24px;color:var(--accent2)}
  .stat span{display:block;font-size:12px;color:var(--muted)}
  .panel{max-width:1200px;margin:24px auto;padding:0 16px}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;position:sticky;top:8px;z-index:50}
  .toolbar input[type=search]{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 14px;font-size:14px;outline:none}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:13px;user-select:none}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-top:18px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
  .badge{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
  .badge.cn{color:#4f8cff;border-color:#2b4a7a}
  .badge.free{color:#22c58b;border-color:#1e5c44}
  .quota{background:var(--card2);border-left:3px solid var(--accent2);border-radius:6px;padding:8px 12px;font-size:14px}
  .quota b{color:var(--accent2);font-size:16px}
  .btn{display:inline-block;text-align:center;background:var(--accent);color:#fff;border-radius:9px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;border:none}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
  .livebox{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:18px}
  .livegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:12px}
  .liveitem{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-size:13px}
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
  .modal.open{display:flex}
  .modal .box{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:600px;width:90%;padding:20px}
  .codebox{display:none;background:#0d1117;border:1px solid var(--border);border-radius:9px;margin-top:8px}
  .codebox.open{display:block}
  pre{padding:12px;font-size:12px;overflow-x:auto;color:#c9d6e8;font-family:monospace}
</style>
</head>
<body>
<header>
  <div class="langsw" id="langsw">🌐 EN</div>
  <h1>🧰 <span class="g" id="title">免费大模型额度导航</span></h1>
  <p id="subtitle">全网免费Token一站式查询 · 每日更新</p>
  <div class="stats">
    <div class="stat"><b id="stTotal">0</b><span data-i="收录平台">收录平台</span></div>
    <div class="stat"><b id="stCn">0</b><span data-i="国内直连">国内直连</span></div>
    <div class="stat"><b id="stGl">0</b><span data-i="海外平台">海外平台</span></div>
  </div>
</header>
<div class="panel">
  <div class="toolbar">
    <input id="q" type="search" placeholder="🔍 搜索平台 / 模型...">
    <div class="chips" id="regionChips">
      <div class="chip on" data-f="all">全部</div>
      <div class="chip" data-f="cn">🇨🇳 国内直连</div>
      <div class="chip" data-f="global">🌐 需外网</div>
    </div>
    <button class="btn ghost" id="calcBtn">🧮 计算器</button>
  </div>
  <div class="livebox">
    <div style="display:flex;justify-content:space-between;font-size:14px">
      <h2 style="font-size:16px;color:var(--accent)">⚡ 实时免费模型</h2>
      <span id="liveMeta">...</span>
    </div>
    <div class="livegrid" id="liveGrid"></div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="modal" id="calcModal"><div class="box"><h3 id="calcT">🧮 额度计算器</h3><div id="calcBody"></div><button class="btn" style="margin-top:12px" onclick="this.parentElement.parentElement.classList.remove('open')">关闭</button></div></div>

<script src="data.js"></script>
<script>
let lang='zh';
const I18N={en:{"收录平台":"Platforms","国内直连":"CN Direct","海外平台":"Global"}};
const t=s=>lang==='zh'?s:(I18N.en[s]||s);
const getSafeId=n=>(n||'').replace(/[^a-z0-9]/gi,'_');

async function loadLive(){
  const grid=document.getElementById('liveGrid');
  const meta=document.getElementById('liveMeta');
  let m=DATA.live?DATA.live.openrouterFreeModels:[];
  const ctrl=new AbortController();
  const tid=setTimeout(()=>ctrl.abort(),3000);
  try{
    const r=await fetch('https://openrouter.ai/api/v1/models',{signal:ctrl.signal});
    clearTimeout(tid);
    const j=await r.json();
    m=j.data.filter(x=>x.id.endsWith(':free')).map(x=>({id:x.id,ctx:x.context_length}));
    meta.textContent=`✅ OK · ${m.length}`;
  }catch(e){meta.textContent=`📦 Snapshot · ${m.length}`;}
  grid.innerHTML=m.map(x=>`<div class="liveitem"><b>${x.id}</b><br><small>ctx: ${x.ctx||'-'}</small></div>`).join('');
}

function render(){
  const kw=document.getElementById('q').value.toLowerCase();
  const f=document.querySelector('#regionChips .on').dataset.f;
  const list=DATA.items.filter(i=>(f==='all'||i.region===f)&&(i.name+i.models).toLowerCase().includes(kw));
  document.getElementById('grid').innerHTML=list.map(i=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between"><h3>${i.name}</h3><span class="badge ${i.region}">${i.region==='cn'?'🇨🇳':'🌐'}</span></div>
      <div class="quota"><b>${i.quota}</b></div>
      <div style="font-size:12px;color:var(--muted)">${i.models}</div>
      <div style="margin-top:auto;display:flex;gap:8px">
        <a class="btn" href="${i.affiliateUrl||i.url}" target="_blank">前往</a>
        ${i.apiBase?`<button class="btn ghost" onclick="document.getElementById('c-${getSafeId(i.name)}').style.display='block'">代码</button>`:''}
      </div>
      <div class="codebox" id="c-${getSafeId(i.name)}"><pre>base_url: ${i.apiBase}\nmodel: ${i.models.split('、')[0]}</pre></div>
    </div>
  `).join('');
}

document.getElementById('q').oninput=render;
document.getElementById('regionChips').onclick=e=>{
  if(e.target.classList.contains('chip')){
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
    e.target.classList.add('on');render();
  }
};
document.getElementById('stTotal').textContent=DATA.items.length;
document.getElementById('stCn').textContent=DATA.items.filter(i=>i.region==='cn').length;
document.getElementById('stGl').textContent=DATA.items.filter(i=>i.region==='global').length;
loadLive();render();
</script>
</body>
</html>
